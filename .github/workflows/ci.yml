# The gate every change passes: formatting, lint, unit tests, HTTP tests,
# end-to-end tests in real browsers, and the production image builds.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt, clippy, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The toolchain (and its clippy/rustfmt components) comes from rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # `cargo test` also runs the HTTP-level tests (real router + real
      # SQLite) and the check that docs/api.md lists every route.
      - run: cargo test --workspace

  web:
    name: Web (typecheck, lint, format, unit tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 1

  e2e:
    name: End-to-end (real browsers)
    needs: [rust, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web/dist
      - run: cargo build
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run e2e
        working-directory: web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: web/test-results
          retention-days: 7

  image:
    name: Production image (build + vulnerability scan)
    needs: [rust, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f docker/Dockerfile -t chatly:ci .
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: chatly:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
