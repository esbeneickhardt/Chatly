[package]
name = "server"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "chatly"
path = "src/main.rs"

[dependencies]
protocol = { path = "../protocol" }
totp = { path = "../totp" }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "sync", "fs", "io-util"] }
axum = { version = "0.7", features = ["json", "ws", "multipart"] }
tower-http = { version = "0.5", features = ["trace", "fs"] }
infer = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rusqlite = { version = "0.31", features = ["bundled"] }
anyhow = "1"
thiserror = "1"
async-trait = "0.1"
rust-embed = "8"
mime_guess = "2"
argon2 = "0.5"
rand = "0.8"
base64 = "0.22"
aes-gcm = "0.10"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
percent-encoding = "2"
sha2 = "0.11.0"
hmac = "0.12"
sha1 = "0.10"
tokio-stream = { version = "0.1.19", features = ["sync"] }
futures-util = "0.3.34"
tokio-util = { version = "0.7.19", features = ["io"] }
str0m = { version = "0.23.1", default-features = false, features = ["rust-crypto"] }
sysinfo = "0.39.6"
socket2 = "0.6"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
